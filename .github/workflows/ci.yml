name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - name: Configure bridge
        run: cmake -S schema/cpp -B build/bridge -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build bridge
        run: cmake --build build/bridge
      - name: Test bridge
        run: ctest --test-dir build/bridge --output-on-failure

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Generated schema files are up to date
        run: |
          npm run schema
          if [ -n "$(git status --porcelain -- schema)" ]; then
            git status --porcelain -- schema
            git diff -- schema
            echo "::error::Generated files are stale. Run 'npm run schema' and commit the result."
            exit 1
          fi
      - run: npm run -ws --if-present test
