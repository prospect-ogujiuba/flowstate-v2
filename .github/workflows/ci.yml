name: ci

# Runs only when code changes: docs, Markdown, eval results and the frozen spike don't trigger it.
# macOS and Windows run on every triggering push (free on a public repo). `npm run ci:full` runs it on demand.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: &code
      - "core/**"
      - "schema/**"
      - "cloud/**"
      - "evals/**"
      - "library/**"
      - "ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
      - "!evals/results/**"
      - "!evals/ab/**"
  pull_request:
    paths: *code
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - name: Configure bridge
        run: cmake -S schema/cpp -B build/bridge -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build bridge
        run: cmake --build build/bridge
      - name: Test bridge
        run: ctest --test-dir build/bridge --output-on-failure

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Build core's CLIs (the library importer runs fs-analyze)
        run: |
          cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLOWSTATE_CORE_BUILD_TESTS=OFF
          cmake --build build/core
      - name: Library catalog is up to date
        run: npm run -w library check
      - name: Generated schema files are up to date
        run: |
          npm run schema
          if [ -n "$(git status --porcelain -- schema)" ]; then
            git status --porcelain -- schema
            git diff -- schema
            echo "::error::Generated files are stale. Run 'npm run schema' and commit the result."
            exit 1
          fi
      - name: Playwright browsers (UI tests)
        run: npx -w ui playwright install --with-deps chromium webkit
      - run: npm run --workspaces --if-present test
