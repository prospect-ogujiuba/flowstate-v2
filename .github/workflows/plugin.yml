name: plugin

# The product plugin (P1-6): builds, tests (session, processor, VST3 host smoke) and pluginval at
# strictness 8 on macOS and Windows, plus a headless Linux build. Unsigned test builds; signing
# and installers are P1-14.

on:
  push:
    paths:
      - "plugin/**"
      - "!plugin/spike/**"
      - "core/**"
      - "schema/**"
      - "ui/**"
      - ".github/workflows/plugin.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-headless
    runs-on: ${{ matrix.os }}
    env:
      BUILD_DIR: build/plugin
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Build id
        shell: bash
        run: echo "FLOWSTATE_BUILD_ID=$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: >
          cmake -S plugin -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DFLOWSTATE_BUILD_ID=$FLOWSTATE_BUILD_ID"

      - name: Configure (Windows, Ninja + MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          cmake -S plugin -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          "-DFLOWSTATE_BUILD_ID=$FLOWSTATE_BUILD_ID"

      - name: Configure (Linux, headless)
        if: runner.os == 'Linux'
        run: >
          cmake -S plugin -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DFLOWSTATE_BUILD_ID=$FLOWSTATE_BUILD_ID"

      - name: Build
        shell: bash
        run: cmake --build "$BUILD_DIR" --config Release

      - name: Test (session, processor, VST3 host smoke)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir "$BUILD_DIR" --output-on-failure
          else
            ctest --test-dir "$BUILD_DIR" --output-on-failure
          fi

      - name: pluginval (strictness 8)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   zip=pluginval_macOS.zip;   bin=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) zip=pluginval_Windows.zip; bin=pluginval.exe ;;
            Linux)   zip=pluginval_Linux.zip;   bin=pluginval ;;
          esac
          curl -fsSL -o "$zip" "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$zip"
          unzip -q -o "$zip" -d pluginval
          pv="pluginval/$bin"
          chmod +x "$pv" || true
          art="$BUILD_DIR"
          plugins=(
            "$art/Flowstate_artefacts/Release/VST3/Flowstate.vst3"
            "$art/FlowstateMidiFx_artefacts/Release/VST3/Flowstate MIDI FX.vst3"
          )
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            cp -R "$art/Flowstate_artefacts/Release/AU/Flowstate.component" ~/Library/Audio/Plug-Ins/Components/
            cp -R "$art/FlowstateMidiFx_artefacts/Release/AU/Flowstate MIDI FX.component" ~/Library/Audio/Plug-Ins/Components/
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            plugins+=(~/Library/Audio/Plug-Ins/Components/Flowstate.component
                      "$HOME/Library/Audio/Plug-Ins/Components/Flowstate MIDI FX.component")
          fi
          run=("$pv")
          if [ "$RUNNER_OS" = "Linux" ]; then
            run=(xvfb-run -a "$pv"); extra=(--skip-gui-tests)
          fi
          for p in "${plugins[@]}"; do
            echo "::group::pluginval $p"
            "${run[@]}" --strictness-level 8 --validate-in-process --timeout-ms 300000 "${extra[@]}" --validate "$p"
            echo "::endgroup::"
          done

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          auval -v aumu Fls2 Flws
          auval -v aumi Flm2 Flws

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          out="dist/flowstate-${{ matrix.name }}"
          mkdir -p "$out"
          for b in \
            "$BUILD_DIR/Flowstate_artefacts/Release/VST3/Flowstate.vst3" \
            "$BUILD_DIR/Flowstate_artefacts/Release/AU/Flowstate.component" \
            "$BUILD_DIR/Flowstate_artefacts/Release/Standalone/Flowstate.app" \
            "$BUILD_DIR/FlowstateMidiFx_artefacts/Release/VST3/Flowstate MIDI FX.vst3" \
            "$BUILD_DIR/FlowstateMidiFx_artefacts/Release/AU/Flowstate MIDI FX.component"; do
            codesign --force --deep --sign - "$b"
            ditto -c -k --keepParent "$b" "$out/$(basename "$b").zip"
          done
          echo "$FLOWSTATE_BUILD_ID" > "$out/BUILD_ID"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/flowstate-${{ matrix.name }}"
          mkdir -p "$out/VST3" "$out/Standalone"
          cp -R "$BUILD_DIR/Flowstate_artefacts/Release/VST3/Flowstate.vst3" "$out/VST3/"
          cp -R "$BUILD_DIR/FlowstateMidiFx_artefacts/Release/VST3/Flowstate MIDI FX.vst3" "$out/VST3/"
          cp "$BUILD_DIR/Flowstate_artefacts/Release/Standalone/Flowstate.exe" "$out/Standalone/"
          echo "$FLOWSTATE_BUILD_ID" > "$out/BUILD_ID"

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: flowstate-${{ matrix.name }}
          path: dist/flowstate-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
